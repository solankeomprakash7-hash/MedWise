[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/ecg"
  to = "/ecg.html"
  status = 200

[[redirects]]
  from = "/ecg/*"
  to = "/ecg.html"
  status = 200
  force = false

[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[context.production.environment]
  NODE_VERSION = "20"
