<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Learn ECG from zero to ward-ready: animated lessons, real 12-lead ECGs and graded practice for medical students, interns and residents." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400..700&family=Chivo+Mono:wght@400..500&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/ecg-manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/brand/icon-32.png" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />
    <link rel="preload" as="image" href="/brand/logo-mark.png" />
    <link rel="preload" as="image" href="/brand/logo-word.png" />
    <title>MedWise ECG</title>
    <!-- Opening animation. Plain HTML and CSS so it shows before the app's code has loaded:
         a heartbeat trace draws across, its spike brings the two halves of the logo together,
         then the word mark writes itself in. The app calls window.mwSplashDone() when it is ready. -->
    <style>
      #mw-splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #ffffff; transition: opacity 380ms cubic-bezier(.2,.8,.2,1), visibility 380ms; }
      #mw-splash.out { opacity: 0; visibility: hidden; }
      #mw-splash .stage { position: relative; width: 120px; height: 130px; }
      #mw-splash .trace { position: absolute; left: 50%; top: 58%; width: min(560px, 92vw); height: 90px; transform: translate(-50%, -50%); overflow: visible; }
      #mw-splash .trace path { fill: none; stroke: #18ab97; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 600; stroke-dashoffset: 600; animation: mw-draw 820ms cubic-bezier(.4,.1,.35,1) forwards, mw-fade 380ms 820ms ease forwards; }
      #mw-splash .half { position: absolute; inset: 0; background: url(/brand/logo-mark.png) center / contain no-repeat; opacity: 0; }
      #mw-splash .left { clip-path: inset(0 50% 0 0); transform: translateX(-26px); animation: mw-join 520ms 380ms cubic-bezier(.2,.9,.25,1.2) forwards; }
      #mw-splash .right { clip-path: inset(0 0 0 50%); transform: translateX(26px); animation: mw-join 520ms 380ms cubic-bezier(.2,.9,.25,1.2) forwards; }
      #mw-splash .pulse { position: absolute; inset: 0; animation: mw-beat 420ms 900ms cubic-bezier(.3,.7,.4,1); }
      #mw-splash .word { width: 168px; height: 43px; background: url(/brand/logo-word.png) center / contain no-repeat;
        clip-path: inset(0 100% 0 0); animation: mw-write 620ms 820ms cubic-bezier(.6,.1,.3,1) forwards; }
      #mw-splash .tag { font: 500 12px/1 Chivo, system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #5f6485; opacity: 0;
        animation: mw-rise 420ms 1250ms ease forwards; }
      @keyframes mw-draw { to { stroke-dashoffset: 0; } }
      @keyframes mw-fade { to { opacity: 0; } }
      @keyframes mw-join { to { opacity: 1; transform: none; } }
      @keyframes mw-beat { 0%, 100% { transform: scale(1); } 35% { transform: scale(1.07); } }
      @keyframes mw-write { to { clip-path: inset(0 0 0 0); } }
      @keyframes mw-rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      /* a returning visitor in the same session: same picture, no wait */
      #mw-splash.quick *, #mw-splash.quick .trace path { animation-duration: 1ms !important; animation-delay: 0ms !important; }
      #mw-splash.quick .trace { display: none; }
      @media (prefers-reduced-motion: reduce) {
        #mw-splash *, #mw-splash .trace path { animation-duration: 1ms !important; animation-delay: 0ms !important; }
        #mw-splash .trace { display: none; }
        #mw-splash { transition: opacity 120ms; }
      }
    </style>
  </head>
  <body>
    <div id="mw-splash" role="status" aria-label="MedWise ECG is loading">
      <div class="stage">
        <svg class="trace" viewBox="0 0 400 90" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 52 H150 q6 -9 12 0 H182 l6 8 l12 -52 l10 70 l7 -26 H238 q14 -16 28 0 H400" />
        </svg>
        <div class="pulse"><div class="half left"></div><div class="half right"></div></div>
      </div>
      <div class="word" aria-hidden="true"></div>
      <div class="tag">ECG, from basics to the bedside</div>
    </div>
    <script>
      (function () {
        var s = document.getElementById('mw-splash'), t0 = Date.now(), quick = false, done = false;
        try { quick = sessionStorage.getItem('mw-splash') === '1'; sessionStorage.setItem('mw-splash', '1'); } catch (e) {}
        var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (quick) s.classList.add('quick');
        var minMs = quick || still ? 0 : 1650; // let the animation finish once per visit
        window.mwSplashDone = function () {
          if (done) return; done = true;
          setTimeout(function () { s.classList.add('out'); setTimeout(function () { s.remove(); }, 420); }, Math.max(0, minMs - (Date.now() - t0)));
        };
        setTimeout(window.mwSplashDone, 6000); // never block the app if something goes wrong
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/ecg/main.tsx"></script>
  </body>
</html>
